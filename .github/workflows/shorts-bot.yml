name: Shorts Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriy kodini yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Output papkasini yaratish
        run: mkdir -p output

      - name: Trendlarni topish
        run: python trend_scanner.py

      - name: Ssenariylarni yaratish
        run: python script_generator.py

      - name: Natijalarni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: shorts-trend-report
          path: output/
          if-no-files-found: error
          retention-days: 7
