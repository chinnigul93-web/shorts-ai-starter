
name: YouTube Shorts Trend Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Python sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Trendlarni topish
        run: python trend_scanner.py

      - name: Shorts ssenariylarini yaratish
        run: python script_generator.py

      - name: Hisobotni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: output/
          retention-days: 7
